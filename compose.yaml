secrets:
  cf_api_token:
    file: ./traefik/cf_api_token.txt

networks:
  public:
    external: true
    name: public
  proxy:
    driver: bridge
    internal: true
  services:
    driver: bridge
    internal: true
  loki-net:
    driver: bridge
    internal: true
  git:
    driver: bridge
    internal: true
  ci:
    driver: bridge
    internal: true

services:
  traefik:
    container_name: traefik
    image: traefik:v3.5
    restart: unless-stopped
    networks:
      - proxy
      - public
      - services
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cf_api_token
    secrets:
      - cf_api_token
    volumes:
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:z
      - ./traefik/dynamic:/etc/traefik/dynamic:z
      - ./traefik/acme.json:/acme.json:z

  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    networks:
      - services
    expose:
      - "3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=hp.moculescu.de
    volumes:
      - ./homepage/config:/app/config:z
      - ./homepage/pictures:/app/public/images:z

  kuma:
    container_name: kuma
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    networks:
      - services
    volumes:
      - ./uptime_kuma/uptime-kuma-data:/app/data:z

  nginx:
    container_name: nginx
    image: nginx:1-alpine
    restart: unless-stopped
    networks:
      - services
    expose:
      - "80"
    volumes:
      - ./nginx/html:/usr/share/nginx/html:z

  loki:
    container_name: loki
    image: grafana/loki:latest
    restart: unless-stopped
    networks:
      - loki-net
    volumes:
      - ./grafana/loki-config.yaml:/etc/loki/loki-config.yaml:z
      - ./grafana/loki-data:/loki:z

  promtail:
    container_name: promtail
    image: grafana/promtail:latest
    restart: unless-stopped
    networks:
      - loki-net
    depends_on:
      - loki
    volumes:
      - ./grafana/promtail-config.yaml:/etc/promtail/promtail-config.yaml:z

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    restart: unless-stopped
    networks:
      - loki-net
      - services
    depends_on:
      - loki
    env_file: .env
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:z
      - ./grafana/data:/var/lib/grafana:z

  git:
    container_name: git
    image: codeberg.org/forgejo/forgejo:10
    restart: unless-stopped
    depends_on:
      - git-db
    environment:
      - USER_UID=1001
      - USER_GID=1001
      - FORGEJO__webhook__ALLOWED_HOST_LIST=ci.moculescu.de  
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=git-db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${GIT_DB_PASSWORD}
    networks:
      - git
      - services
      - public
    volumes:
      - ./git:/data:z
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    expose:
      - "3000"
    ports:
      - "127.0.0.1:2222:22"     # SSH for git, loopback-only; expose via VPS later if wanted

  git-db:
    container_name: git-db
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=${GIT_DB_PASSWORD}
      - POSTGRES_DB=forgejo
    networks:
      - git
    volumes:
      - ./postgres:/var/lib/postgresql/data:z

  woodpecker-server:
    container_name: woodpecker
    image: woodpeckerci/woodpecker-server:v3
    restart: unless-stopped
    depends_on:
      - git
    environment:
      - WOODPECKER_OPEN=false
      - WOODPECKER_HOST=https://ci.moculescu.de
      - WOODPECKER_FORGEJO=true
      - WOODPECKER_FORGEJO_URL=https://git.moculescu.de
      - WOODPECKER_ADMIN=amoculescu
      - WOODPECKER_GRPC_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_FORGEJO_CLIENT=24b9ca89-fad5-4955-a87a-58d2b5e71b1a
      - WOODPECKER_FORGEJO_SECRET=${WOODPECKER_FORGEJO_CLIENT_SECRET}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}  
    volumes:
      - ./woodpecker-server:/var/lib/woodpecker:z
    networks:
      - git
      - services
      - ci
      - public

  woodpecker-agent:
    container_name: woodpecker-agent
    image: woodpeckerci/woodpecker-agent:v3
    restart: unless-stopped
    user: "0:0"
    security_opt:
      - label=disable
    depends_on:
      - woodpecker-server
    command: agent
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_BACKEND_DOCKER_NETWORK=homelab_git
      - WOODPECKER_GRPC_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
    volumes:
      # Woodpecker's docker backend speaks the docker API; the rootful podman
      # socket (podman.socket) is docker-API-compatible. If pipelines fail to
      # spawn, revisit — fallback is the dedicated CI VM plan.
      - /run/podman/podman.sock:/var/run/docker.sock
      - ./woodpecker-agent-config:/etc/woodpecker:z
    networks:
      - ci

  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    restart: unless-stopped
    network_mode: host
    command: hbbs
    volumes:
      - ./rustdesk:/root:z
    depends_on:
      - hbbr

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    restart: unless-stopped
    network_mode: host
    command: hbbr
    volumes:
      - ./rustdesk:/root:z

  actual_budget:
    container_name: actual_budget
    image: ghcr.io/actualbudget/actual:latest
    restart: unless-stopped
    networks:
      - services
    expose:
      - "5006"
    healthcheck:
      test: ["CMD-SHELL", "node src/scripts/health-check.js"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./actual-budget-data:/da
